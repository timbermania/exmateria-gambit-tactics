[plugin]

name="ExMateria Catalogue"
description="Final Fantasy Tactics' character catalogue: who exists. A unit's durable identity, the live registry keyed by slug, the ROM name/birthday tables, the identity-to-template resolver and the two seeders that build membership. Registers one autoload; publishes one symbol. See README.md and docs/adr/0267."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. MEASURED rather than assumed, in both
; directions: the addon ships 12 `.gd` files, 4 `.json` payloads and NOTHING
; else — no shader, no `.gdshaderinc`, no `.tres`, no scene — so there is no
; fork primitive for it to name. Every member `extends RefCounted` except
; `registry/CharacterCatalog.gd`, which extends `Node` because it is the
; autoload; both are stock classes.
; `grep -rn 'compositor_layer\|CompositorEffect\|CompositorRenderLayer\|
; render_layers\|RenderingDevice' addons/exmateria_catalogue` is empty.
engine="stock"
; The sibling addons this one is ALLOWED to reach and therefore needs staged with
; it. MEASURED, not assumed, and RE-measured whenever this key changes:
; `check_addon_portability.py` arm 5 over this population reports 43 lines over
; three roots — `exmateria_almanac` 30 (`JobDatabase` 15, `UnitProgression` 9,
; `GambitList` 4, `SpriteDatabase` 2), `exmateria_schema` 7 (`Zodiac` 4,
; `BaseStatType` 2, `EquipSlot` 1) and `exmateria_platform` 6 (`JsonAsset`, the
; PORT). All three have to be staged for this addon to parse alone.
;
; 🔴 TAKE THOSE PER-ROOT FIGURES OFF THE TOOL, NOT OFF THE PRINTED ROWS. Arm 5's
; row listing truncates at six line numbers per row (`lines[:6]`, then a `…`), so a
; total summed from what it prints is a FLOOR, not the census — the headline integers
; are computed from the full sets. These were taken with the display cap lifted. Until
; #1239 this line read "61 lines over three roots — `exmateria_almanac` 53 …
; `exmateria_sprite_rig` 2 (`SpritePaletteResolver`)", named only three of the four
; roots it then declared, and every integer in it was stale.
;
; 🔴 `exmateria_schema` WAS ADDED BY #1180, AND THIS LINE USED TO SAY "Nothing here
; reaches `exmateria_schema`." That stopped being true when `EquipSlot`,
; `BaseStatType` and `Zodiac` became ADR-0118 dec. 1's TWELFTH schema row
; (ADR-0294 dec. 2) and left `UnitProgression` for the kernel:
; `identity/Character.gd` seeds five equipment slots and picks a base-stat body,
; `identity/UnitBirthdays.gd` derives a sign, and `seeding/AllTemplatesSeeder.gd`
; picks a body — 7 arm-5 lines over three members. They are FREE, not debt, because
; `_walk_roots.PORTABLE_TIERS` holds `kernel`, which is ADR-0202 dec. 2's rule that
; every reach INTO the kernel is free. It is a dependency all the same and the rig
; has to stage it, which is what this key is for. The almanac was the SECOND addon
; to acquire this edge (#1159); this is the third.
;
; 🔴 THE ALMANAC ROW IS DEBT AND IS ACCEPTED, NOT HIDDEN (ADR-0262 dec. 5). It is
; the first sibling dependency in this corpus that targets an addon which is
; neither the kernel nor the platform port, and the fold that would erase it was
; rejected on the ground that folding severs no edge — it only stops the guard
; printing one.
;
; 🔴 `exmateria_sprite_rig` WAS DECLARED HERE AND REACHED NOTHING, AND #1239 DROPPED
; IT. This note used to call it "the same shape one line smaller", carrying "an
; `ARM1_BURN_DOWN` row for its symbol half" — both stopped being true at #1071, which
; paid that row by DELETING the key (`templates/CharacterTemplateResolver.gd` had been
; asking the rig for `job_body_palette_row` and passing it through; ADR-0272). The
; burn-down list is empty and arm 5 reports 0 rows and 0 lines from this addon onto
; `ExMateriaSpriteRig`. The declaration outlived the reach from 2026-09-09 to 2026-09-11
; — 474 commits, or 110 counted on first-parent, measured to `e194f8a80`; the basis is
; stated because a merge-heavy history gives those two numbers a 4x spread. What
; survives in this package is four COMMENTS — `install/CatalogueContent.gd:17,40`,
; `templates/CharacterTemplateResolver.gd:91`, `seeding/AllTemplatesSeeder.gd:60` —
; and they describe shared texture trees and a rule's home, not a parse-time need.
;
; Dropping it severs nothing and buys no portability: nothing was reaching it. It stops
; the rig staging a package this addon does not use, which is what a DECLARATION is for
; (`engine=`'s reason, one field over). It takes the stranger rig's staged closure from
; five addons to four, and that is the witness — `tests/stranger/exmateria_catalogue/run.sh`
; prints both the line and the closure.
;
; 🔴 AND IT DID NOT CHANGE THE BINARY, BY AN ACCIDENT WORTH WRITING DOWN. `rig.sh`
; picks the engine from the CLOSURE, not the subject, and `exmateria_sprite_rig` is
; `engine="fork"` — so this drop would have flipped the run from the fork binary to
; stock had #1180 not already added `exmateria_schema`, which is also `fork`, as a
; direct dep. A dep drop is a possible ENGINE change here — and since #1241 that
; coupling is GUARDED rather than eye-checked: `check_addon_portability.py`'s arm 8b
; prints this addon's declared `stock` beside its closure's `fork` and holds the pair
; in `ARM8_CLOSURE_ENGINE`, so a dep edit that moves the binary reds the pre-flight in
; both directions. Arm 8 holds the line below to the same standard — every name on it
; must be a sibling arm 5 measures a reach to, and every reach arm 5 measures must be
; named. That is the arm #1239's defect needed: it was a declaration reaching nothing,
; and it survived 474 commits because `deps=` had exactly one reader and it was the rig.
deps="exmateria_almanac exmateria_platform exmateria_schema"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `system` is one of `kernel port system rules`: this addon is one of the
; eleven, so reaching it is NOT free. The classifier still supplies the system's
; NAME — `Character Catalogue` 12 / `infrastructure` 1 — because a name is a
; question about files and the tier is a question about the package (#1059).
;
; This addon is the one that PAYS for the almanac's tier rather than the one that
; sets it: every one of arm 5's debt lines is this package naming
; `exmateria_almanac`'s symbols. It shipped 55 at phase 1 and the tree read 53 the
; same day — #1071 (ADR-0272) had already paid the `exmateria_sprite_rig` row,
; whose two arm-5 lines WERE arm 1's row. Corrected here because this is a live
; source comment; ADR-0262 dec. 5 reads 55 and is an accepted ADR left unedited.
;
; 🔴 36 OF THOSE 53 SURVIVED #1059 PHASE 2 (ADR-0273), AND WHICH 36 IS THE POINT.
; Free-ness inside the `rules` tier is per MEMBER: 15 lines naming `JobDatabase`
; and 2 naming `SpriteDatabase` are `table` reads — ADR-0115 dec. 4's content shadow,
; which every system casts — and moved into arm 5's FREE block. What remained was 32
; lines of `UnitProgression` and 4 of `GambitList`, both declared `state`.
;
; 🔴 AND 13 OF THOSE 36 SURVIVE #1180. The 36 were never one thing: 23 of them named
; a value set that happened to be NESTED in `UnitProgression` — 16 `EquipSlot`, 4
; `BaseStatType`, 2 `zodiac_from_birthday`, plus the `UnitBirthdays.gd` alias that
; existed only to carry the last two. ADR-0294 dec. 2 admitted all three to the
; shared kernel as ADR-0118 dec. 1's twelfth schema row, and reaching the kernel is
; free. The 13 that remain are 9 lines of `UnitProgression` and 4 of `GambitList`,
; and every one of them HOLDS or CONSTRUCTS the object rather than spelling a value:
; `Character.gd`'s `var progression`/`var gambits` fields, its three
; `UnitProgression.new()` sites and one type annotation, and
; `AllTemplatesSeeder._minimal_progression`.
;
; Neither is a free-set question: ADR-0241 dec. 1 already ruled `UnitProgression`
; THIS ADDON'S by ownership and dec. 3 ruled that it does not split. #1059 phase 3
; was to own the move, and ADR-0300 REJECTS it: priced against the almanac's
; `MEMBER_KINDS`, the move retires these nine lines and pays ten — `StatCalculator`
; is a `rule` on ten lines of `UnitProgression.gd` — and a seventh reach,
; `BaseStatsDatabase`, has no published name to reach it BY. ADR-0280 dec. 6 rules
; the remainder the ACCEPTED PRICE and not a countdown — #1180 paid the part that
; was a vocabulary and sets no target of zero for the rest — and ADR-0300 dec. 6
; says where the countdown would stop if anyone ran it anyway: THIRTEEN is the floor
; under this architecture. See the `deps=` note above.
tier="system"
