[plugin]

name="ExMateria Effects"
description="Final Fantasy Tactics' effect runtime: the parsed E###.BIN file model, the cast that runs it, the four channel subsystems, the particle pool, the TRAP family, the twelve fold/native shaders and the engine-fold compositor. Registers four autoloads; publishes one symbol. See README.md and docs/adr/0295."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. `fork` is MEASURED, not assumed, and this is
; the first addon in the package to need it: `render/EngineFoldCompositor.gd`
; extends `CompositorEffect` and ten shaders under `render/` and `callbacks/`
; declare `render_mode compositor_fold`, which is the fork's engine-fold
; primitive (a stock 4.7 build self-disables it and every folded prim silently
; vanishes). `grep -rn 'compositor_fold\|CompositorRenderLayer\|
; is_compositor_layer_supported' addons/exmateria_effects` reports ten files.
;
; 🔴 THE ABSENCE ARM RUNS FOR `fork` AND ONLY FOR `fork` (ADR-0194 dec. 7): its
; subject is a claim about primitives being missing, so this declaration is the
; one a rig can falsify by staging the addon against a stock binary.
engine="fork"
; The sibling addons this one is ALLOWED to reach and therefore needs staged with
; it. MEASURED with `tools/membership_arms.py` over the 64 members on the move
; commit — arm 5, the guard's own rule: `exmateria_schema` 46 lines (`Fold`,
; `ColorStack`, `DepthMode`, `ot_depth.gdshaderinc`), `exmateria_platform` 28
; (`PsxMagnitude`, `CameraCalibration`, `PsxChirality`, `pixel_aspect`,
; `psx_sprite_stretch`), `exmateria_battlefield` 6, `exmateria_almanac` 4 and
; `exmateria_render` 3.
;
; Reaching `exmateria_schema` (kernel) and `exmateria_platform` (port) is FREE by
; ADR-0202 dec. 2 and `_walk_roots.PORTABLE_TIERS`; the other three are DEBT,
; accepted and printed rather than folded away — the same reading
; `addons/exmateria_catalogue/plugin.cfg` records for its almanac row.
;
; 🔴 A SIXTH DEPENDENCY IS REAL AND IS DELIBERATELY NOT ON THIS LINE:
; `exmateria_sound`. `cast/EffectInstance.gd` preloads three files out of its `runtime/`
; and `file_model/EffectData.gd:215` names `ExMateriaSound.FedsBank` — the blueprint's
; Format-owner rule, `Effects` reads `Audio`'s `feds.bin` (ADR-0288 dec. 8 calls that row
; *correct as written*). It is absent from `deps=` because this key is what
; `tests/stranger/shared/rig.sh` STAGES, and it stages `$PKG/addons/<name>`: the sound
; package is EXTRACTED (`_walk_roots.EXTRACTED`), lives in `exmateria-sound/`, ships its
; own two rigs, and stays ruled by its own package's guards (ADR-0212 dec. 11) — which
; is also why it declares no `engine=` for `rig.sh`'s closure check to read. Naming it
; here would make this addon's rig exit 2 on a dependency that has its own rig.
;
; So the edge is carried where it can be checked instead of asserted: it is a permitted
; root in `check_addon_install.py`'s target for this subject, an arm-5 debt row in
; `check_addon_portability.py`, and a `known_failures.tsv` row in this addon's stranger
; rig. Three registers, one edge, none of them silent.
deps="exmateria_almanac exmateria_battlefield exmateria_platform exmateria_render exmateria_schema"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `system` is one of `kernel port system rules`: `Effects` is one of the
; eleven systems, so reaching it is NOT free, and arm 4b's rule — only a
; non-system addon may DECLARE a `global uniform` — is what #1217 paid before the
; move (`psx_fx_stretch` moved to the port, `psx_gamma` stayed the host's).
tier="system"
