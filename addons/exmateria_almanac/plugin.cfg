[plugin]

name="ExMateria Almanac"
description="Final Fantasy Tactics' rule tables and the pure functions over them: jobs, items, abilities, base stats, status bits, gambits, encounters and sprite lookups. Ships its own JSON payloads. Publishes one symbol. See README.md and docs/adr/0244."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. MEASURED rather than assumed, in both
; directions: the addon ships 37 `.gd` files and ZERO shaders, `.gdshaderinc`,
; `.tres` or scenes, so there is no fork primitive for it to name. Every member
; `extends RefCounted` except `progression/UnitProgression.gd`, which extends
; `Resource`; both are stock classes. `grep -rn 'compositor_layer\|CompositorEffect\|
; CompositorRenderLayer\|render_layers' addons/exmateria_almanac` is empty.
;
; The one thing that WOULD have made this fork-only was removed rather than
; declared: `status/StatusRegistry.gd` used to parse
; `res://src/gpu/shaders/combat_common.glslinc` for a drift assertion, which is a
; host path and a `Battle` file. See ADR-0244 dec. 4 — the assertion moved to
; `tests/StatusRegistryTest.gd`, which already re-implemented it in full.
;
; `tests/stranger/exmateria_almanac/run.sh` used to run the declared binary, so
; the install pass WAS the check on this declaration.
;
; 🔴 #1159 COST THAT CHECK, AND THE DECLARATION IS STILL TRUE. `deps=` now names
; `exmateria_schema`, which declares `engine="fork"`, and `shared/rig.sh` boots
; the binary that can parse everything it STAGES rather than the subject's own —
; so this rig now runs on the FORK and the install pass no longer falsifies a
; wrong `stock` here. That is the mechanism `tests/stranger/README.md` records
; against `exmateria_catalogue` (#1099); this addon is the SECOND to hit it and
; the first to hit it by a move rather than by being born that way. The
; declaration is not promoted to `fork` for ADR-0194 dec. 7's reason: it is a
; measured claim about the files in THIS addon, and no file here names a
; compositor primitive. Goal #5 is now unmet on the declaration axis for this
; addon too, which is a cost of ADR-0280 dec. 3 rather than a defect in it.
;
; #1241 did not pay that cost back — arm 8b checks the DIVERGENCE, not the files — but
; it did stop the divergence being silent: `check_addon_portability.py` prints this
; addon's `stock` beside its closure's `fork` on every pre-flight and carries the pair
; as a named `ARM8_CLOSURE_ENGINE` row, which reds if the closure's engine moves either
; way. The unmet axis is now a REGISTERED cost rather than an unwatched one.
engine="stock"
; The sibling addons this one is ALLOWED to reach and therefore needs staged with
; it. MEASURED, not assumed: `check_addon_portability.py` arm 5 over this
; population reports 11 lines reaching `ExMateriaPlatform.JsonAsset` — the
; ADR-0211 dec. 4 alias, in eleven of the payload-backed databases. That is the
; PORT, the conformant residual ADR-0223 dec. 8 books, and it has to be staged
; for this addon to parse alone.
;
; 🔴 `exmateria_schema` WAS ADDED BY #1159, AND THIS LINE USED TO SAY "Nothing
; here reaches `exmateria_schema`." That stopped being true the moment
; `UnitRole` became ADR-0118 dec. 1's ELEVENTH schema row (ADR-0280 dec. 3) and
; left for the kernel: `jobs/JobDatabase.gd` PRODUCES a role,
; `gambits/Gambit.gd` renders one and `gambits/TargetSelector.gd` applies one,
; and all three now name `ExMateriaSchema.UnitRole` — 3 arm-5 lines. They are
; FREE, not debt, because `_walk_roots.PORTABLE_TIERS` holds `kernel`, which is
; ADR-0202 dec. 2's rule that every reach INTO the kernel is free. It is a
; dependency all the same and the rig has to stage it, which is what this key is
; for.
deps="exmateria_platform exmateria_schema"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `rules` is the FOURTH tier and this addon is its only member: the game's
; rule tables and the pure functions over them, belonging to no one system.
;
; 🔴 THIS LINE EXISTS BECAUSE THE INFERENCE WAS WRONG HERE, AND ONLY HERE.
; `check_addon_portability` used to derive the tier from the modal `classify()`
; bucket over this addon's OWN files, and `classify()` books a file to the system
; that CONSUMES it (ADR-0243 dec. 3) — so a package of tables inherits the names
; of its READERS. Measured 2026-09-09 at `c6549fd4c`: Battle 14 / content 11 /
; UI 5 / infrastructure 2 / generated 2, so the guard believed the almanac was
; the BATTLE system's addon.
;
; Measured against its ACTUAL consumers instead — 698 lines over 140 rows,
; non-test, `src/` plus every sibling addon root, resolved through the façade the
; way arm 5 resolves it (`tools/check_addon_portability.sibling_class_reaches`):
;
;     Battle 274 · UI 265 · assembler 69 · Character Catalogue 56 · content 11
;     · Cutscene 8 · Audio 6 · Effects 6 · Campaign 3
;
; SEVEN OF THE ELEVEN SYSTEMS REACH IT and the top two are 3.4% apart. (#1059's
; body says nine of eleven; nine is the number of BUCKETS in that table, and
; `assembler` and `content` are not systems — ADR-0271 dec. 2 carries the
; correction.) That is ADR-0115 dec. 4's content shadow — *"every system casts a
; shadow of FFT-specific data"* — except it is the union of seven shadows plus
; two non-system buckets, which is not one system's by a wide margin.
;
; 🔴 `rules` IS NOT A FREE TIER, and that is deliberate rather than pending.
; `_walk_roots.PORTABLE_TIERS` holds `kernel` and `port` only. Freeing the package
; wholesale would blind arm 5 to a surface that is measurably shared rather than
; owned: 581 of those 698 lines (83%) are on members that TWO OR MORE of the
; eleven reach, and only 40% of the total is a `*Database`. `GambitCondition` is
; UI 44 / Battle 30, `Gambit` is Battle 35 / UI 22, `TargetSelector` is Battle 43
; / UI 34 — ADR-0115 dec. 6's warning that a feature threads SYSTEMS, not
; dec. 4's shadow. (Dec. 6 reads *"Gambits thread through three systems"*; the
; `two` this line shipped at phase 1 was a paraphrase — ADR-0273 dec. 6.)
;
; 🔴 THE TIER IS NOT THE WHOLE ANSWER SINCE #1059 PHASE 2 (ADR-0273). Free-ness
; inside `rules` is asked of the MEMBER, against the kind this addon's facade
; declares in `const MEMBER_KINDS` — eighteen `table`, eleven `rule`, three
; `state`. A `table` is a bank and reading it is dec. 4's content shadow, so it is
; free; a `rule` and a `state` stay printed. Arm 5 read 373 free / 36 debt at that
; pass, and every one of the 36 named `UnitProgression` or `GambitList`, which are
; `state`.
;
; 🔴 IT READS 424 / 13 SINCE #1180, AND THE DEBT SIDE MOVING IS THE NEW PART.
; Every ⚠ below is a free-side reading with the debt untouched, which was the point
; of them — the free number is an install-dependency count and only the debt number
; is a verdict. #1180 is about the verdict: 23 of the 36 lines named `EquipSlot`,
; `BaseStatType` or `zodiac_from_birthday`, all three of which were NESTED in
; `UnitProgression` rather than being about it. ADR-0294 dec. 2 admitted them to the
; shared kernel as ADR-0118 dec. 1's twelfth schema row, so this addon lost a member
; (`items/EquipSlot.gd`) and gained kernel reaches in `progression/UnitProgression.gd`
; (which re-exports all three) and `items/EquipCandidates.gd`. Those reaches are FREE
; for the same reason `UnitRole`'s are. `MEMBER_KINDS` is UNCHANGED: `EquipSlot` was
; never published, so the eighteen/eleven/three split does not move.
;
; ⚠ ELEVEN `rule` AT ADR-0273; TWELVE AT ADR-0278; ELEVEN AGAIN SINCE #1159 —
; AND THE TWO ELEVENS ARE DIFFERENT SETS. The twelfth was `AbilityFamily`, a
; `rule` on dec. 1's own test rather than on the tie-break: delete its
; computation and nothing is left. It has no arm-5 row, so 373/36 is unchanged
; by it. The row the register then LOST is `UnitRole`, which did not get
; re-ruled: it held no derivation at all, so neither of ADR-0273's two words
; could name it, and it left for the shared kernel (ADR-0280 dec. 3).
;
; ⚠ SEVENTEEN AND 371 AT ADR-0273; EIGHTEEN AND 373 SINCE #1120. The eighteenth
; `table` is `ShopAvailabilityDatabase`, derived from ADR-0273 dec. 1 rather than
; from its name — the `*Database` proxy is that ADR's own rejected alternative.
; The free side moved by its two `ExMateriaPlatform.JsonAsset` lines and nothing
; else (A/B'd on the file's presence: 371 absent, 373 present, 36 debt in both).
; THE DEBT DID NOT MOVE, which is the number this block is about.
;
; ⚠ THE DEBT WAS 53 HERE, NOT 55. This file shipped 55 at phase 1; #1071
; (ADR-0272) had already paid the `exmateria_sprite_rig` row, whose two arm-5
; lines WERE arm 1's row. ADR-0262 dec. 5 and ADR-0267's soft-spot note still read
; 55 and are accepted ADRs left unedited; this is a live source comment and is
; corrected. 53 inherited, 17 freed by member kind, 36 standing.
tier="rules"
