[plugin]

name="ExMateria Sprite Rig"
description="Final Fantasy Tactics unit-sprite rig: SEQ opcode vocabulary, sprite-layer composition, animation playback and the unit material variants. Publishes one symbol. See README.md and docs/adr/0217."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim.
;
; 🔴 RE-MEASURED IN #744 AND IT FLIPPED, WHICH IS WHY THE SKELETON'S LINE SAID TO
; RE-MEASURE IT. `stock` was a true claim about a façade plus one enum file. The
; population that arrived brings `crystal/crystal_fold.gdshader`, whose line 17 is
; `render_mode unshaded, cull_disabled, depth_draw_never, blend_add,
; compositor_layer` — and `compositor_layer` is a FORK-ONLY primitive, the same one
; that makes `exmateria_render` and `exmateria_battlefield` fork addons. Under
; stock 4.7 the compositor self-disables and the crystal's additive fold silently
; renders nothing, which is exactly the failure mode a `stock` declaration would
; have sent a rig looking for. (`render/unit_flat.gdshader:53` names it too, but
; only in a comment — a comment is not a primitive, and the grep that finds both
; is not the measurement.)
engine="fork"
; The sibling addons this one is ALLOWED to reach and therefore needs staged with
; it. MEASURED, not assumed: `check_addon_portability.py` arm 1 over the arrived
; population reports 10 lines reaching `ExMateriaSchema.*` (`DepthMode`, `Fold`,
; `SpriteLayer`, `Facing`, `UnitMaterialVariant`, `ClockOwner`) and 1 reaching
; `ExMateriaPlatform.TunePort`. Both are ports, both are the CONFORMANT residual
; ADR-0217 P3b books, and both have to be staged for this addon to parse alone.
;
; `exmateria_render` is NOT a dep, though the crystal compositor's other half
; lives there: `EngineFoldCompositor` is reached by the HOST, not from inside this
; addon — zero `.gd` lines here name it. Declaring it would stage something this
; addon never reaches, which is the mistake the skeleton's `deps=""` avoided in
; the other direction.
deps="exmateria_schema exmateria_platform"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `system` is one of `kernel port system rules`: this addon is one of the
; eleven, so reaching it is NOT free and arm 5 prints every sibling that names
; its `class_name` — `exmateria_catalogue` names `SpritePaletteResolver` on 2
; lines and that row is #1071. The classifier still supplies the system's NAME —
; `Sprite Rig` 34 / `infrastructure` 1 / `assembler` 1 (#1059).
tier="system"
