[plugin]

name="ExMateria Battlefield"
description="The tactical lattice and what stands on it: terrain and skirt geometry, the tile overlay and cursor, map texturing and palette animation, the isometric camera, and the assembly that composes a map from ROM-derived data. Extraction #3. See README.md and docs/adr/0157, 0164, 0166, 0168, 0170, 0184."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim. Four shaders say it outright:
; `cursor/cursor_fold_{add,mix,sub}.gdshader` and `overlay/tile_decal_fold.gdshader`
; carry `render_mode … compositor_layer`, and the last of those states it in a
; comment on line 13 — "Forward+ / fork only (compositor_layer + engine Pass B)."
; `tests/stranger/exmateria_battlefield/run.sh` boots stock once per run and goes
; red if the fork's primitives ever appear there, which would mean this line can go.
engine="fork"
; The sibling addons this one is ALLOWED to reach and therefore needs staged with
; it — README.md's own "Dependencies it is allowed to have": the kernel
; (`ColorStack`, `ColorRecipe`, `DepthMode`, `Fold`) and the ports
; (`ExMateriaPlatform.TunePort`, `ExMateriaPlatform.DisplayPort` — this addon
; reaches BOTH siblings through their one façade name since ADR-0212 dec. 1).
; A declaration, in the same sense as `engine=`: a rig that staged
; an UNdeclared sibling would quietly supply something this addon never said it
; needed, which is the exact failure the stranger project exists to expose.
deps="exmateria_schema exmateria_platform"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED for `engine=`'s reason:
; a fact about the package, stated where a rig that stages the package can read
; it. `system` is one of `kernel port system rules`: this addon is one of the
; eleven, so reaching it is NOT free and arm 5 prints every sibling that names
; its `class_name`. The classifier still supplies the system's NAME —
; `Battlefield` 55 / `tests` 16 / `infrastructure` 1 — because a name is a
; question about files and the tier is a question about the package (#1059).
tier="system"
