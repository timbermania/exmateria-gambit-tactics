[plugin]

name="ExMateria SPU"
description="A PlayStation 1 SPU for Godot: 24 voices of ADPCM with the console's own ADSR, pitch/volume LFOs, noise, FM and reverb, mixed by a native C++ core and delivered as an AudioStream. Bring your own samples. See README.md."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED, and for this package it
; is the only thing that can say so — `classify()` has no verdict for any of its
; 8 files, for the sibling row's reason. `system` matches what
; `_walk_roots.EXTRACTED` already declares (`Audio`), which keeps the verdict it
; has today: `exmateria_sound` names `Spu` on 51 lines and those are free on the
; SAME-PACKAGE ground (ADR-0003 dec. 4's vendoring), not on a tier ground.
;
; 🔴 WHETHER THIS IS REALLY A SYSTEM IS OPEN, and declaring it is what makes the
; question askable. The description above is a generic PlayStation SPU that
; brings no samples — which reads like a `port`, not like the Audio system. It is
; declared `system` here because that is what the tree measures today and a tier
; declaration must not smuggle in a re-pricing; ADR-0271 records it as a soft
; spot.
tier="system"
