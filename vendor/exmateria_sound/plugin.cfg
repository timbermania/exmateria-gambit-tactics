; deployment copy and walking it would double-count), so `classify()` has no
; verdict for any of its 155 files and the modal-bucket vote returned None for
; all of them. None was the FREE set. The only thing standing between that and a
; free verdict was `_walk_roots.EXTRACTED` naming this path by hand; the vote
; itself has never once answered the question for a package it was not told
; about. `EXTRACTED` still declares the system NAME (`Audio`); this line declares
; the tier.
